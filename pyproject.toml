[project]
name = "autogis"
version = "0.1.0"
description = "Automation tools for ArcGIS Pro and ArcGIS Online / Survey123"
requires-python = ">=3.10"
dependencies = ["PyYAML", "click>=8.0", "openpyxl", "numpy>=1.24", "xlrd>=2.0"]   # click>=8.0: introspect.py's _field() calls param.to_info_dict(); xlrd: legacy .xls EQuIS EDDs (lazy import in equis_reader)

[project.optional-dependencies]
dev = ["pytest", "Pillow>=9.0", "matplotlib>=3.7", "pyproj"]   # Pillow/matplotlib/pyproj so the importorskip-gated tests actually run
cloud = ["arcgis>=2.4,<3", "setuptools"]   # Pro 3.4+ / arcgis-dist.json unverified (Esri/arcpy restricted).
    # setuptools: arcgis's `features.geo` package still imports the stdlib
    # `distutils` module (removed in Python 3.12+); it swallows that failure
    # in a bare `except ImportError: pass` and silently loses
    # `_is_geoenabled`/`GeoAccessor`, which later surfaces as an unrelated
    # `AttributeError` deep inside `gis.content.add()`. Modern setuptools
    # ships a vendored `distutils` shim that satisfies the import -- no code
    # change needed, just having the package present. Confirmed against the
    # exact failure on arcgis 2.4.3 / Python 3.14.
report = ["Pillow>=9.0"]   # photo embedding for generate-inspection-report (openpyxl Image needs PIL)
gui = ["PySide6"]   # unified GUI adapter (ADR-0050); not needed for CLI/.pyt use
profile = ["matplotlib>=3.7"]   # subsurface profile rendering (generate-subsurface-profile)
ocr = ["torch", "transformers", "pillow", "pymupdf"]   # boring-log OCR digitization assist (draft-lithology-from-scan); DRAFT tool, see docs/superpowers/specs/2026-07-08-draft-lithology-from-scan-design.md
opentopo = ["pyproj"]   # non-WGS84 AOI reprojection for envmon download-dem (lazy import; stdlib urllib covers the download itself)

[project.scripts]
autogis = "autogis.adapters.cli:autogis"
autogis-harvest = "autogis.adapters.cli:autogis"
autogis-gui = "autogis.adapters.gui.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autogis*"]

[tool.setuptools.package-data]
"autogis.core.common.report_assets" = ["*.css"]
# init-site reads these at runtime via importlib.resources; without this a
# wheel install would omit them and `envmon init-site` would FileNotFoundError.
"autogis" = ["config/_templates/site_skeleton/*.yaml", "config/recipes/*.yaml"]
