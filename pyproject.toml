[project]
name = "autogis"
version = "0.1.0"
description = "Automation tools for ArcGIS Pro and ArcGIS Online / Survey123"
requires-python = ">=3.10"
dependencies = ["PyYAML", "click", "openpyxl", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest", "Pillow>=9.0"]   # Pillow so the importorskip-gated photo tests actually run
cloud = ["arcgis>=2.4,<3"]   # Pro 3.4+ / arcgis-dist.json unverified (Esri/arcpy restricted)
report = ["Pillow>=9.0"]   # photo embedding for generate-inspection-report (openpyxl Image needs PIL)

[project.scripts]
autogis = "autogis.adapters.cli:autogis"
autogis-harvest = "autogis.adapters.cli:autogis"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autogis*"]
