# ============================================================================
# SCREENING LEVELS — H281 Glasgow
# ============================================================================
# The pipeline's PRIMARY screening-level source is the workbook's own RBSL
# row (parsed per sheet, footnotes stripped with a QA record). This file is
# the SECONDARY source, used only when a sheet has no screening row.
# Populate it from the governing regulatory tables with a citation in
# `source` — the importer will never invent a number, and figures flag
# results with no screening level rather than guessing.
#
# GW VPH/EPH fractions below are populated from a real, cited regulatory
# table: Montana DEQ Tier 1 Risk-Based Screening Levels (RBSL) for
# groundwater (MDEQ, 2018 — Tier 1 Risk-Based Corrective Action Guidance for
# Petroleum Releases, May 2018), verified against a real client workbook
# carrying that same table. TPH/TEH stay `value: null` deliberately — Montana
# sets no bulk criterion for those, only for their individual fractions; this
# is a confirmed "not applicable," not an unsourced placeholder. Everything
# else (metals, SOIL matrix, EDB/1,2-DCA) remains an unpopulated `_TODO`
# stub — no source workbook has surfaced values for those yet.
#
# Structure: screening_levels.<MATRIX>.<canonical analyte> -> {value, units,
# source}. Matrix keys must match Env_AnalyticalResults.Matrix (GW, SOIL).

screening_levels:
