# SCREENING LEVELS — H281 Glasgow
# ============================================================================
# Values are deliberately null. The pipeline's PRIMARY screening-level source
# is the workbook's own RBSL row (parsed per sheet, footnotes stripped with a
# QA record). This file is the SECONDARY source, used only when a sheet has
# no screening row. Populate it from the governing regulatory tables
# (e.g. MDEQ RBSLs / DEQ-7) with a citation in `source` — the importer will
# never invent a number, and figures flag results with no screening level
# rather than guessing.
#
# Structure: screening_levels.<MATRIX>.<canonical analyte> -> {value, units,
# source}. Matrix keys must match Env_AnalyticalResults.Matrix (GW, SOIL).

