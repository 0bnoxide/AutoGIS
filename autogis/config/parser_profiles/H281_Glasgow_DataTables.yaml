profile_id: DRAFT_H281_Glasgow_DataTables
profile_description: >-
  Quarterly GW monitoring workbook for H281 Glasgow: combined water-level +
  VPH/EPH analytical sheet, inorganics (IBI) sheet, dissolved metals sheet,
  and a field-duplicate RPD sheet. DRAFT anchors from spec hints.
workbook_type: quarterly_gw_monitoring
date_system: "1900"
formula_handling: use_cached_then_qa
# plausible_gwe_range_ft lives on the site config, which owns the site's
# AMSL band and is where config_validation requires it (#445). It was here
# too, and the profile copy was the one that actually took effect --
# exactly the drift that made the site.yaml value a silent no-op.

sheets:
  - sheet_name: "GW Table 2"
    data_type: GW_ANALYTICAL_AND_WATER_LEVEL
    title_rows: [1, 2, 3]
    group_header_row: 5          # _TODO verify — matches the real H272 analog
    analyte_header_row: 6        # _TODO verify — corrected from 7 (H272 analog: no
                                  # spacer row between group header and analyte header)
    units_row: 7                 # _TODO verify — corrected from 8
    screening_level_row: 8       # _TODO verify — corrected from 9; RBSL row,
                                  # footnotes stripped w/ QA
    data_start_row: 9            # _TODO verify — corrected from 10
    data_end_detection_strategy: "consecutive_blank_ids:3"
    id_column: A                 # location (well) ID
    screen_interval_column: B
    date_column: C
    mpe_column: D                # measuring point elevation
    dtw_column: E                # depth to water
    gwe_column: F                # groundwater elevation (often a formula)
    analyte_columns: {from: G, to: V}   # _TODO verify last analyte column
    duplicate_markers: ["DUP", "-D", "FD"]

  - sheet_name: "Table 3"
    data_type: IBI               # iron/inorganics indicators (GW matrix)
    title_rows: [1, 2]
    analyte_header_row: 3        # _TODO verify
    units_row: 4                 # _TODO verify
    data_start_row: 5            # _TODO verify
    id_column: A
    date_column: B
    analyte_columns: {from: C, to: G}

  - sheet_name: "Metals Table"
    data_type: METALS            # dissolved metals in groundwater
    title_rows: [1, 2]
    analyte_header_row: 3        # _TODO verify
    units_row: 4                 # _TODO verify
    screening_level_row: null    # _TODO set if the sheet carries a SL row
    data_start_row: 5            # _TODO verify
    id_column: A
    date_column: B
    analyte_columns: {from: C, to: K}

  - sheet_name: "RPD"
    data_type: RPD
    title_rows: [1, 2]
    data_start_row: 4            # _TODO verify block layout
    id_column: A                 # iterated over the analyte column
    rpd_layout:
      analyte_column: A
      parent_column: B
      duplicate_column: C
      rpd_column: D
      rl_column: E
      parent_location_id: "_TODO e.g. MW-3"
      duplicate_location_id: "_TODO e.g. MW-103 (DUP)"
      event_date_cell: "B2"      # _TODO verify
