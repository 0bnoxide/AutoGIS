profile_id: H272_Havre_GW_Elevation
profile_description: >-
  Fluid-level measurement table (Table 1) for Holiday Stationstore #272 /
  Circle K Store 2746272, Havre, MT. Water-level data only — no analyte
  columns on this sheet.
workbook_type: gw_elevation_only
date_system: "1900"
formula_handling: use_cached_then_qa

sheets:
  - sheet_name: "GW Elev"
    data_type: GW_WATER_LEVEL_ONLY
    title_rows: [1, 2, 3]
    analyte_header_row: 6
    units_row: 7
    data_start_row: 8
    id_column: A                   # "WELL"
    date_column: B                 # "DATE"
    mpe_column: C                  # "Monitoring Point Elevation"
    dtw_column: E                  # "Depth to Water"
    gwe_column: G                  # "Groundwater Elevation" (raw/apparent)
    ignored_columns: [D, F, H]
    # D = "Depth to product", F = "Product Thickness", H = "Corrected
    # Groundwater Elevation" — LNAPL fields with no home in the current
    # schema (WaterLevelRecord only has MPE/DTW/GWE). At an LNAPL site the
    # *corrected* GWE (product-thickness-adjusted) is often the
    # contour-relevant value, not the raw one in column G — using raw GWE
    # here is a real domain choice, not an oversight. Flagged for a human
    # decision on whether WaterLevelRecord needs a CorrectedGWE field before
    # this profile is used for real contouring.
