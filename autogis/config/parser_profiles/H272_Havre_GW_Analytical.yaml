# ============================================================================
# PARSER PROFILE — H272 Havre GW Analytical            *** ANCHORS VERIFIED ***
# ============================================================================
# Anchors below were confirmed against the real workbook
# ("T 2 -GW anlaytical data DRAFT .xlsx", sheets "GW Quality" / "GW Quality
# (2)") via Tool 1 (draft-parser-profile) plus targeted header-row reads.
# The source workbook itself never enters this repo; only structural facts
# (row/column anchors, header label text) and the public MDEQ RBSL numbers
# the client's own table already carries crossed over.
#
# Tool 1's heuristic guessed analyte_header_row=40 for these sheets — WRONG,
# an artifact of propose_parser_profile() picking header_rows[-1] (the last
# ambiguous candidate in the scan window) rather than the real header row.
# The real analyte header is row 6, confirmed directly: row 6 reads
# Benzene/Toluene/Ethylbenzene/Xylenes/Total Purgeable Hydrocarbons/MTBE/... —
# exactly the RBSL-table analytes, one row above the confirmed units row (7)
# and RBSL row (8, "MDEQ RBSL1"). This is the concrete example the DRAFT
# banner on H281_Glasgow_DataTables.yaml warns about: never trust an
# auto-proposed anchor without a human/targeted check.
#
# Site: Holiday Stationstore #272 / Circle K Store 2746272, Havre, MT.
# "GW Quality" carries an extra "Total BTEX" derived column (Q) — marked
# ignored_columns, not an independently regulated analyte.
#
# The workbook also contains a second, row-aligned sheet "GW Quality (2)" — a
# DRAFT variant annotated with BOS-200 pilot-injection results. It is
# DELIBERATELY NOT parsed (user decision, 2026-07-22, issue #272): it is draft
# working data, and because the Env_AnalyticalResults idempotency key uses a
# bare SourceCell A1 ref with no sheet qualifier, importing a row-aligned
# duplicate sheet risks silently dropping a corrected draft value that lands at
# the same cell position as the final. Final analytical data lives on
# "GW Quality" only. (Real-import verified against the client workbook.)
#
# data_type GW_ANALYTICAL: analytical results with NO water-level columns
# (a genuinely different physical layout than H281_Glasgow's single combined
# sheet, which has MPE/DTW/GWE + analytes together). Wired end-to-end via
# normalize_gw_table_2 (normalize_groundwater.py), which runs the analyte
# columns through normalize_matrix_table and skips water-level extraction
# for sheets of this type.
# ============================================================================

profile_id: H272_Havre_GW_Analytical
profile_description: >-
  Groundwater analytical results table (Table 2) for Holiday Stationstore
  #272 / Circle K Store 2746272, Havre, MT. VPH/EPH fraction results only —
  water-level data ships separately, see H272_Havre_GW_Elevation.yaml.
workbook_type: gw_analytical_only
date_system: "1900"
formula_handling: use_cached_then_qa

sheets:
  - sheet_name: "GW Quality"
    data_type: GW_ANALYTICAL
    title_rows: [1, 2, 3]
    group_header_row: 5
    analyte_header_row: 6              # Tool 1 heuristic wrongly said 40
    units_row: 7
    screening_level_row: 8             # "MDEQ RBSL1" (Montana DEQ Tier 1)
    data_start_row: 9
    id_column: A
    date_column: B
    analyte_columns: {from: C, to: P}  # Benzene .. C11-C22 Aromatics (14)
    ignored_columns: [Q]               # "Total BTEX" — derived, not RBSL'd
    # "GW Quality (2)" (DRAFT BOS-200 variant) deliberately omitted — see banner.
