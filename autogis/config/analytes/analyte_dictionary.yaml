# ============================================================================
# ANALYTE DICTIONARY
# ============================================================================
# canonical_name is the storage key. aliases are matched case/whitespace/
# punctuation-insensitively by normalize_analyte_name(). default_screening_level
# values are deliberately null where no defensible source was available —
# screening levels are read from the workbook screening row first, then from
# config/screening_levels/. DO NOT invent regulatory numbers here.

