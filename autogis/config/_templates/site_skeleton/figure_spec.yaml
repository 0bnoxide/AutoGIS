# Figure spec skeleton — __SITE_NAME__ groundwater analytical map.
# Generated by `envmon init-site`. Placeholder-marked items must be verified
# against the site's template APRX before use. NOTE: {site_id}, {figure_number},
# {figure_spec_id} and {event_date} below are RUNTIME placeholders resolved by
# the figure engine per invocation — leave them as-is.
figure_spec_id: __SITE_ID___GW_Analytical
site_id: __SITE_ID__
map_type: GW_ANALYTICAL
matrix: GW
figure_number: "2"
figure_title: "Groundwater Analytical Results"
layout_name: "_TODO match the template APRX layout name"
template_aprx: "../../templates/aprx/__SITE_ID___Template.aprx"   # _TODO
reference_scale: 1200                       # _TODO match the figure scale

output_filename_pattern: "{site_id}_Fig{figure_number}_GW_Analytical_{event_date}"

# Analyte sets (canonical names; ordering by dictionary display_order)
analyte_sets:
  petroleum_six_pack: ["_TODO Benzene", "_TODO TPH", "_TODO MTBE"]   # _TODO set the site analyte list
default_analyte_set: petroleum_six_pack

sample_selection_rule: latest_per_location
duplicate_handling_rule: prefer_parent

callout_template:
  template_id: __SITE_ID___GW
  base_font_points: 6
  standoff_points: 18
  point_buffer_points: 10
  quadrant_order: [NE, NW, SE, SW, E, W, N, S]

extent_boundary_layer: SiteBoundary
extent_buffer_pct: 5
required_layers: [MonitoringWells, Env_CalloutBoxes, Env_CalloutLeaderLines]
visible_layers: [MonitoringWells, SiteBoundary, Env_CalloutBoxes,
                 Env_CalloutLeaderLines]
layer_definition_queries:
  Env_CalloutBoxes: "SiteID = '{site_id}' AND FigureSpecID = '{figure_spec_id}'"
  Env_CalloutLeaderLines: "SiteID = '{site_id}' AND FigureSpecID = '{figure_spec_id}'"
layout_text:
  FigureTitle: "Groundwater Analytical Results"
  FigureNumber: "Figure 2"
