# Site configuration — __SITE_NAME__
# Generated by `envmon init-site`. All site-specific values live HERE, never
# hardcoded in src/. Placeholder-marked items MUST be completed before use.

site_id: __SITE_ID__
site_name: "__SITE_NAME__"
project_number: "__SITE_ID__"          # _TODO confirm the real project number
address: "_TODO street address"
city: "_TODO city"
state: "_TODO e.g. MT — verify against the governing screening-level reference"
coordinate_system: "_TODO e.g. NAD 1983 StatePlane Montana FIPS 2500 (US Feet)"
map_units: feet               # feet | meters — must match coordinate_system

# Default data locations (relative paths resolve against this file)
default_gdb: "../../templates/gdb/__SITE_ID__.gdb"                    # _TODO create/point to the site GDB
default_aprx_template: "../../templates/aprx/__SITE_ID___Template.aprx"   # _TODO point to the layout template

# Names of the pre-existing site feature classes inside the GDB
monitoring_wells_fc: MonitoringWells
soil_borings_fc: SoilBorings
site_boundary_fc: SiteBoundary

# Text placed on layouts unless a figure spec overrides it.
# Keys must match layout TEXT element names.
default_layout_text:
  SiteName: "__SITE_NAME__"
  SiteAddress: "_TODO street address"
  ProjectNumber: "__SITE_ID__"
  PreparedBy: "_TODO"
  AnalyticalKey: >-
    All results in ug/L unless noted. Bold red = exceeds screening level.
    "<x.x" = not detected at reporting limit shown. J = estimated.
    D = diluted. NM = not measured. NS = not sampled. NA = not analyzed.
  Notes: "_TODO standard figure notes"

# Plausibility window for groundwater elevations (ft AMSL); rows outside
# this range are excluded from contouring with a QA ERROR.
plausible_gwe_range_ft: [0, 10000]   # _TODO set the realistic AMSL range for this site
