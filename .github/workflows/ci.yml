name: CI

on:
  workflow_dispatch:   # manual "Run workflow" button / `gh workflow run`
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    # Weekly latest-dependency run (Monday 06:17 UTC). pyproject pins lower
    # bounds only and the runner is fresh, so the plain install below resolves
    # every dependency at its newest release and surfaces an upstream break
    # without waiting for the next PR to hit it.
    - cron: "17 6 * * 1"

concurrency:
  # event_name in the key: a schedule run and a push both resolve github.ref
  # to refs/heads/main and would otherwise cancel each other (#469).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix-coverage:
    # Measure permission paths that the Windows suite necessarily skips.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install -e . pytest pytest-cov
      - name: Run survey-form tests with POSIX coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/test_cli_yaml_handles.py --cov=autogis --cov-report=xml:coverage-posix.xml
      - name: Upload POSIX coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: posix-coverage
          path: coverage-posix.xml
          if-no-files-found: error

  pytest:
    needs: posix-coverage
    # arcpy-free suite. Windows, not ubuntu: the repo is Windows-native
    # (C:\ path fixtures, PowerShell + Windows-path coordination logic) and the
    # suite is demonstrably green there — ubuntu would be an unverified OS change.
    # arcpy/arcgis stay uninstalled: core/ and adapters/ import without them by
    # invariant, and those extras are Pro-conda-only anyway. gui + real-file
    # tests self-skip (pytest.importorskip("PySide6"), skipif not path.exists()).
    runs-on: windows-2022
    # Bound the job well under GitHub's 360-min ceiling. Without this a hung
    # step ran to that ceiling on PR #464 and reported a *passing* suite as
    # "cancelled", billing ~6 h of windows-2022 minutes at 2x (#469). The suite
    # itself is ~5-6 min; #388 documents the slow Matplotlib render.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Sonar's new-code detection needs full history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # matches ArcGIS Pro 3.6 bundled Python
          cache: pip
      - name: Install (arcpy-free dev extras)
        run: python -m pip install -e ".[dev]" pytest-xdist
      - name: Installed wheel smoke (base dependencies)
        timeout-minutes: 8
        run: python -I tests/smoke_wheel_install.py
      - name: Run test suite
        env:
          # repo-root on the path so gui-executor subprocess tests import autogis
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q -n auto --durations=20 --cov=autogis --cov-report=xml
      # The one script that has a self-check gets it run (#465 item 4). Git
      # Bash ships on windows-2022; shell: bash resolves it explicitly.
      - name: watch-pr-reviews self-check
        shell: bash
        run: bash .claude/scripts/test-watch-pr-reviews.sh

      - name: Download POSIX coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: posix-coverage

      # Scan after the Windows suite, importing its coverage.xml plus the
      # focused Linux report for POSIX-only permission paths. A red suite
      # stops metrics publication. Skipped for fork PRs, which cannot read
      # SONAR_TOKEN. See issue #452.
      # The scanner hung here indefinitely on PR #464 after the UCFG cache
      # restore. A step-level cap is the load-bearing half of #469: it turns a
      # silent multi-hour hang into a fast, clearly-attributed step failure,
      # after the suite's own result is already recorded. Healthy scans run
      # ~3 min. Whether a Sonar failure *should* fail this check at all
      # (continue-on-error) revisits ADR-0110 and is left as an owner call.
      - name: SonarQube Scan
        timeout-minutes: 10
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
