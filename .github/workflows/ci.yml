name: CI

on:
  workflow_dispatch:   # manual "Run workflow" button / `gh workflow run`
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # arcpy-free suite. Windows, not ubuntu: the repo is Windows-native
    # (C:\ path fixtures, PowerShell + Windows-path coordination logic) and the
    # suite is demonstrably green there — ubuntu would be an unverified OS change.
    # arcpy/arcgis stay uninstalled: core/ and adapters/ import without them by
    # invariant, and those extras are Pro-conda-only anyway. gui + real-file
    # tests self-skip (pytest.importorskip("PySide6"), skipif not path.exists()).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # matches ArcGIS Pro 3.6 bundled Python
          cache: pip
      - name: Install (arcpy-free dev extras)
        run: python -m pip install -e ".[dev]" pytest-xdist
      - name: Run test suite
        env:
          # repo-root on the path so gui-executor subprocess tests import autogis
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q -n auto --durations=20
          --deselect=tests/envmon/test_cli_subsurface_profile.py::test_generate_subsurface_profile_renders
          --deselect=tests/envmon/test_subsurface_profile.py::test_render_profile_skips_boring_with_missing_ground_elevation

  matplotlib-render:
    # Matplotlib's first render takes 4-9 minutes on hosted Windows runners.
    # Keep the real render coverage on every run without blocking the
    # Windows-native suite; see issue #388.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install render dependencies
        run: python -m pip install -e ".[profile]" pytest
      - name: Run Matplotlib render tests
        run: >-
          python -m pytest -q
          tests/envmon/test_subsurface_profile.py::test_render_profile_skips_boring_with_missing_ground_elevation
          tests/envmon/test_cli_subsurface_profile.py::test_generate_subsurface_profile_renders
          --durations=5
